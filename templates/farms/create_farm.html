{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block content %}

<div class="farm-form-page">

    <div class="farm-form-card">

        <h1>{% trans "Create Your Farm" %}</h1>

        <p class="farm-subtitle">
            {% trans "Start managing your rabbits, events and farm activity in one place." %}
        </p>

        <form method="post" class="farm-form">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="farm-btn">
                {% trans "Create Farm" %}
            </button>
        </form>

    </div>

</div>

{% endblock %}
