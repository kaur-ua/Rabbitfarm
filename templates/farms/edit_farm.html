{% extends 'base.html' %}

{% block content %}

<div class="card p-4 shadow-sm">

    <h2>Edit Farm</h2>

    <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="row mb-3">
        <label class="col-sm-3 col-form-label">Farm Name</label>
        <div class="col-sm-5">
            {{ form.name }}
        </div>
    </div>

    <div class="row mb-3">
        <label class="col-sm-3 col-form-label">Location</label>
        <div class="col-sm-5">
            {{ form.location }}
        </div>
    </div>

    <div class="row mb-3">
        <label class="col-sm-3 col-form-label">Phone</label>
        <div class="col-sm-5">
            {{ form.phone }}
        </div>
    </div>

    <div class="row mb-3">
        <label class="col-sm-3 col-form-label">Description</label>
        <div class="col-sm-7">
            {{ form.description }}
        </div>
    </div>
    <div class="row mb-3">
    <label class="col-sm-3 col-form-label">Farm Photo</label>
    <div class="col-sm-7">
        {{ form.image }}
    </div>
</div>

    <div class="row">
        <div class="offset-sm-3 col-sm-5">
            <button type="submit" class="btn btn-success">Save</button>
        </div>
    </div>

</form>
        

</div>

{% endblock %}
