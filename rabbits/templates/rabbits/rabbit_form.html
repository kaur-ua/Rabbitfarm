{% extends "base.html" %}
{% load i18n %}

{% block content %}

<h2>
    {% if form.instance.pk %}
        {% trans "Edit Rabbit" %}
    {% else %}
        {% trans "Add Rabbit" %}
    {% endif %}
</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-outline-secondary px-4">
    {% trans "Save" %}
    </button>
</form>

{% endblock %}
