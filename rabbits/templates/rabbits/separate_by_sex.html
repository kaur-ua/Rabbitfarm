{% extends "base.html" %}
{% load i18n %}

{% block content %}

<div class="container mt-4">

    <h2>
        {% blocktrans with group_name=group.name %}Separate Group {{ group_name }} by Sex{% endblocktrans %}
    </h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="btn btn-warning">
            {% trans "Separate" %}
        </button>

        <a href="{% url 'group_list' %}"
           class="btn btn-secondary">
           {% trans "Cancel" %}
        </a>

    </form>

</div>

{% endblock %}
